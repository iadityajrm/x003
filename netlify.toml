[build]
  command = "npm run build"
  publish = "dist"

  [build.environment]
    VITE_GEMINI_API_KEY = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

  [functions.environment]
    GEMINI_API_KEY = ""

# Redirect for single page application routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
