    <script>
      (function() {
        try {
          var saved = localStorage.getItem('relay_theme') || localStorage.getItem('dwellio_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
